[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yarg-career-builder"
version = "0.2.0"
description = "Build YARG career presets (portable Song-Tuple careers) from your song library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
yarg-career-builder = "yarg_career_builder.app:main"
yarg-career-builder-cli = "yarg_career_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yarg_career_builder = ["resources/*"]
